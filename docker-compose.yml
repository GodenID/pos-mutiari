services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos123
      POSTGRES_DB: posdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://pos:pos123@db:5432/posdb?schema=public
      PORT: 3000
      JWT_SECRET: ganti-minimal-32-karakter-untuk-lokal
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"

volumes:
  pgdata:
